name: vuln

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Audit the latest runtime dependencies
        run: |
          composer update --no-dev --no-interaction --no-progress
          composer audit --no-dev
      - name: Audit the lowest allowed runtime dependencies
        if: ${{ !cancelled() }}
        run: |
          composer update --no-dev --prefer-lowest --prefer-stable --no-interaction --no-progress
          composer audit --no-dev
